services:
  postgres:
    image: postgres:16-alpine
    container_name: charteforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: charteforge
      POSTGRES_PASSWORD: charteforge
      POSTGRES_DB: charteforge
    ports:
      # 5433 souvent pris (autres projets locaux) — CharteForge utilise 5434
      - '5434:5432'
    volumes:
      - charteforge_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U charteforge -d charteforge']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  charteforge_pg_data:
